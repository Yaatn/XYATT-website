<html lang="tr">
<head>

<title>Sipariş Takibi — XYATT</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
:root{--bg:#07090b;--panel:#0d1114;--line:#20262b;--muted:#89939a;--text:#eef2f4;--acid:#d8ff3e;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.container{width:min(1400px,calc(100% - 48px));margin:auto}
header{height:78px;border-bottom:1px solid var(--line);background:rgba(7,9,11,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:30px}
.logo{display:flex;align-items:center;width:150px;height:44px;overflow:hidden}.logo img{display:block;width:150px;height:auto;max-width:none}
nav{display:flex;gap:30px;color:#9da6ac;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
nav a:hover{color:#fff}
.nav-cta{border:1px solid #394147;padding:12px 17px;font-size:11px;font-weight:700;letter-spacing:.08em}
.nav-cta:hover{border-color:var(--acid);color:var(--acid)}
section{padding:64px 0;border-bottom:1px solid var(--line)}
.eyebrow{font:10px 'DM Mono',monospace;color:var(--acid);letter-spacing:.14em;text-transform:uppercase}
h2{font:800 clamp(32px,4.5vw,58px)/1.02 Sora,sans-serif;letter-spacing:-.06em;margin:14px 0 20px}
.lead{max-width:620px;color:#929ca3;font-size:16px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 19px;border:1px solid #394147;font:700 11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{border-color:var(--acid)}
footer{padding:36px 0;color:#69737a;font-size:12px}
.footer-row{display:flex;justify-content:space-between;gap:20px;align-items:center}
.footer-logo{display:flex;align-items:center;width:125px}.footer-logo img{width:125px;height:auto;display:block}


/* TRACKING */
.track{padding:64px 0 90px;border-bottom:0}
.track-wrap{max-width:720px;margin:auto}
.track h2{margin-top:12px}
.order-chip{display:inline-flex;gap:10px;align-items:center;margin:6px 0 30px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font:12px 'DM Mono',monospace;color:#aab2b7}
.order-chip b{color:var(--acid);letter-spacing:.04em;word-break:break-all}
.stages{list-style:none;margin:0;padding:0;position:relative}
.stage{position:relative;display:flex;gap:18px;align-items:flex-start;padding:0 0 26px}
.stage:last-child{padding-bottom:0}
.stage::before{content:"";position:absolute;left:17px;top:36px;bottom:-2px;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage.done::before{background:var(--acid);opacity:.55}
.dot{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 15px 'DM Mono',monospace;border:1px solid #394147;color:var(--muted);background:var(--bg);position:relative;z-index:1}
.stage.done .dot{background:var(--acid);border-color:var(--acid);color:#07090b}
.stage.current .dot{border-color:var(--acid);color:var(--acid);box-shadow:0 0 0 0 rgba(216,255,62,.5);animation:pulse 1.9s infinite}
.stage-body{padding-top:6px;font-size:16px;line-height:1.45;color:#aab2b7}
.stage.done .stage-body{color:var(--text)}
.stage.current .stage-body{color:var(--text);font-weight:700}
.tag{display:inline-block;margin-left:10px;padding:3px 8px;border:1px solid var(--acid);border-radius:6px;font:10px 'DM Mono',monospace;color:var(--acid);letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;font-weight:500}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,255,62,.45)}70%{box-shadow:0 0 0 12px rgba(216,255,62,0)}100%{box-shadow:0 0 0 0 rgba(216,255,62,0)}}
.notice{margin-top:30px;padding:18px 20px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:14px;line-height:1.65;color:#aab2b7}
.notice b{color:var(--text)}
.notice.good{border-color:#4a5a14;background:rgba(216,255,62,.06);color:#e4efb8}
.state{padding:26px;border:1px solid var(--line);background:var(--panel);border-radius:14px;font-size:15px;line-height:1.7;color:#aab2b7}
.state b{color:var(--text)}
.actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:900px){
.container{width:min(100% - 32px,700px)}
header{height:70px}
nav{display:none}
section{padding:48px 0}
}
@media(max-width:560px){
.container{width:calc(100% - 24px)}
.nav-cta{padding:10px 12px}
.logo{width:130px;height:40px}.logo img{width:130px}
.stage-body{font-size:15px}
.tag{display:block;margin:6px 0 0;width:max-content}
}
</style>
</head>

<script>
(function(){
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxPAMGyN-87Q6hFJ5kJvQG1MMIPs_bzuffi_Et07fBqC9vXw61ytde-YtnVDLi0mG_z/exec';

  // The 7 fulfilment stages (Turkish, customer-facing)
  var STAGES = [
    'Sipariş Onaylandı',
    'Fabrikada Hazırlık Sırasında',
    'Fabrikadan Sevk Edildi',
    'Uluslararası Taşıma',
    'XYATT Lojistik Merkezi\'ne Ulaştı — Antalya',
    'Teslimat Adresine Yolda',
    'Teslim Edildi'
  ];

  var el = function(id){ return document.getElementById(id); };

  function orderNumber(){
    var m = window.location.pathname.match(/(\d{6,20})\/?$/);
    if(m) return m[1];
    var q = new URLSearchParams(window.location.search).get('no') || '';
    return /^\d{6,20}$/.test(q) ? q : '';
  }

  function message(html){
    el('loading').style.display = 'block';
    el('loading').innerHTML = html;   // only fixed text below, never user input
  }

  function render(stage){
    var list = el('stages');
    list.innerHTML = '';
    // only completed stages + the current one, future stages are never shown
    for(var i = 1; i <= stage; i++){
      var isCurrent = (i === stage) && stage < 7;
      var li = document.createElement('li');
      li.className = 'stage ' + (isCurrent ? 'current' : 'done');

      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.textContent = isCurrent ? '→' : '✓';

      var body = document.createElement('div');
      body.className = 'stage-body';
      body.appendChild(document.createTextNode(STAGES[i-1]));
      if(isCurrent){
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'Şu an burada';
        body.appendChild(tag);
      }
      li.appendChild(dot); li.appendChild(body);
      list.appendChild(li);
    }
    el('loading').style.display = 'none';
    list.style.display = 'block';

    var n = el('notice');
    if(stage === 7){
      n.innerHTML = '<div class="notice good"><b>Siparişin teslim edildi.</b> XYATT\'ı tercih ettiğin için teşekkür ederiz. Bir sorun olursa <b>destek@xyatt.com.tr</b> adresine yazabilirsin.</div>';
    } else {
      n.innerHTML = '<div class="notice">Durum, siparişin ilerledikçe bu sayfada otomatik olarak güncellenir. Sayfayı yenileyerek son durumu görebilirsin. Sorularını <b>destek@xyatt.com.tr</b> adresine iletebilirsin.</div>';
    }
  }

  var no = orderNumber();
  if(!no){
    message('<b>Sipariş numarası bulunamadı.</b><br>Lütfen e-postandaki takip bağlantısını kullan. Yardım için <b>destek@xyatt.com.tr</b> adresine yazabilirsin.');
    return;
  }
  el('orderNo').textContent = no;
  el('chip').style.display = 'inline-flex';

  fetch(ENDPOINT + '?action=track&no=' + encodeURIComponent(no))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok){ throw new Error('bad'); }
      if(!d.found){
        message('<b>Bu numarayla bir sipariş bulamadık.</b><br>Numarayı kontrol et veya e-postandaki bağlantıyı kullan. Yardım için <b>destek@xyatt.com.tr</b> adresine yazabilirsin.');
        return;
      }
      if(!d.paid){
        message('<b>Siparişin alındı, ödemeni bekliyoruz.</b><br>Havale/EFT yaptıysan dekontu sipariş numaranla birlikte <b>destek@xyatt.com.tr</b> adresine gönder. Ödemen onaylanır onaylanmaz bu sayfada takip başlar.');
        return;
      }
      render(d.stage);
    })
    .catch(function(){
      message('<b>Durum şu an yüklenemedi.</b><br>Lütfen birkaç dakika sonra tekrar dene. Sorun devam ederse <b>destek@xyatt.com.tr</b> adresine yaz.');
    });
})();
</script>
